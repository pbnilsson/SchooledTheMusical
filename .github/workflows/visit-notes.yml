name: Visit notes

# Pulls the last few days of visit data off the collector and commits it
# into this repo, so the record of record lives here and not on someone
# else's server.

on:
  schedule:
    - cron: "10 8 * * *"    # 08:10 UTC — about 4am Eastern
    - cron: "10 20 * * *"   # 20:10 UTC — about 4pm Eastern
  workflow_dispatch:        # ...or whenever you press the button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rows from the collector
        env:
          KEY: ${{ secrets.SCHOOLED_NOTES_KEY }}
        run: |
          mkdir -p data/days
          SINCE=$(date -u -d '3 days ago' +%F)
          curl -sS --fail-with-body \
            "https://schooled-notes.pbnilsson.workers.dev/export?key=$KEY&since=$SINCE&prune=1" \
            -o /tmp/rows.json
          node scripts/split-days.js /tmp/rows.json

      - name: Rebuild the summary
        run: node scripts/build-summary.js

      - name: Commit anything new
        run: |
          git config user.name "Peter Nilsson"
          git config user.email "pbnilsson@gmail.com"
          git add data
          git diff --staged --quiet || git commit -m "Visit notes: sync $(date -u +'%F %H:%M')"
          git push
